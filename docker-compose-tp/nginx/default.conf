# Reverse proxy : seul point d'entrée de l'application (port 80).
# Les conteneurs sont joints par leur nom de service Docker Compose
# (frontend, backend), résolu par le DNS interne de Docker.
# "localhost" désignerait le conteneur Nginx lui-même.

server {
    listen 80;
    server_name _;

    # En-têtes transmis aux services, pour qu'ils connaissent le vrai client.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api1 -> backend (le chemin /api1 est conservé : pas d'URI après le port)
    location /api1 {
        proxy_pass http://backend:3000;
    }

    # /api2 -> backend
    location /api2 {
        proxy_pass http://backend:3000;
    }

    # Tout le reste -> frontend React
    location / {
        proxy_pass http://frontend:80;
    }
}
