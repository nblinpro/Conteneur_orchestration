# ---------------------------------------------------------------------------
# Secret : stocke les mots de passe dans le cluster, équivalent du fichier .env
# de Docker Compose. Les Deployments lisent ces valeurs avec "secretKeyRef".
# Modèle : copier en secret.yml (ignoré par git) puis remplacer les valeurs.
# À appliquer après namespace.yml et avant les Deployments.
# ---------------------------------------------------------------------------
apiVersion: v1                # API de base de Kubernetes
kind: Secret                  # type d'objet : un Secret
metadata:
  name: wordpress-secret      # nom utilisé par les Deployments pour lire les valeurs
  namespace: wordpress        # doit être dans le même namespace que les pods qui l'utilisent
type: Opaque                  # Secret générique (paires clé/valeur libres)
stringData:                   # valeurs en clair : Kubernetes les encode lui-même en base64
                              # (base64 = encodage, PAS du chiffrement)
  ROOT_PWD: changeme          # mot de passe de l'utilisateur root de MySQL
  WP_DB: wordpress            # nom de la base créée pour WordPress
  WP_USER: toto               # utilisateur MySQL utilisé par WordPress
  WP_PASSWORD: changeme       # mot de passe de cet utilisateur
