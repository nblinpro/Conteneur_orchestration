apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: test
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          for i in $(seq 1 20); do
            (
              while true; do
                wget -q -O /dev/null http://nginx-service
              done
            ) &
          done
          wait
      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"