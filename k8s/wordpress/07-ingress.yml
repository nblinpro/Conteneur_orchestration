apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pma-add-slash
  namespace: wordpress
spec:
  redirectRegex:
    regex: ^(.*)/phpmyadmin$
    replacement: ${1}/phpmyadmin/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pma-strip-prefix
  namespace: wordpress
spec:
  stripPrefix:
    prefixes:
      - /phpmyadmin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: wordpress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: wordpress-pma-add-slash@kubernetescrd,wordpress-pma-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /phpmyadmin
            pathType: Prefix
            backend:
              service:
                name: phpmyadmin-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-svc
                port:
                  number: 80