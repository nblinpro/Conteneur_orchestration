# jobs-api : API REST des offres d'emploi. Utilise sql-data et rabbitmq. Appelée par web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  labels:
    app: jobs-api
spec:
  replicas: {{ .Values.apiReplicas }}
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels:
        app: jobs-api
        tier: backend
    spec:
      serviceAccountName: jobs-api-sa   # compte aux droits limités (13-rbac.yml)
      # Affinité (sujet) : jobs.api => sql.data
      # = essayer de placer ce pod sur le même nœud qu'un pod sql-data
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: sql-data }
              topologyKey: kubernetes.io/hostname   # "même nœud"
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: jobs-api
        image: "{{ .Values.image }}:jobs-api"
        ports:
        - containerPort: 80
        # variables reprises du docker-compose fourni
        env:
        - name: ConnectionString
          valueFrom:
            secretKeyRef: { name: dotnetgigs-secrets, key: JOBS_CONNECTION }
        - name: HostRabbitmq
          value: rabbitmq                           # nom du Service RabbitMQ
        - name: Logging__Console__LogLevel__Default
          value: Information                        # Ressources (CPU, RAM, disque temporaire) : lues dans values.yaml (resources.jobsApi).
        # toYaml recopie le bloc tel quel, nindent 10 le décale de 10 espaces sous "resources:".
        resources:
          {{- toYaml .Values.resources.jobsApi | nindent 10 }}
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
  labels:
    app: jobs-api
spec:
  selector:
    app: jobs-api
  ports:
  - port: 80
