# identity-api : API REST d'authentification. Utilise user-data (Redis) et rabbitmq.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  labels:
    app: identity-api
spec:
  replicas: {{ .Values.apiReplicas }}
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
        tier: backend
    spec:
      # Affinité (sujet) : identity.api => user.data
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: user-data }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: identity-api
        image: "{{ .Values.image }}:identity-api"
        ports:
        - containerPort: 80
        env:
        - name: RedisHost
          value: user-data:6379                     # Service Redis
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        # Ressources (CPU, RAM, disque temporaire) : lues dans values.yaml (resources.identityApi).
        # toYaml recopie le bloc tel quel, nindent 10 le décale de 10 espaces sous "resources:".
        resources:
          {{- toYaml .Values.resources.identityApi | nindent 10 }}
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  labels:
    app: identity-api
spec:
  selector:
    app: identity-api
  ports:
  - port: 80
