# identity.api : API des utilisateurs (Redis + RabbitMQ)
# Modèle Helm équivalent à k8s/08-identity-api.yml (voir ce fichier pour l'explication détaillée de chaque champ).
# Différences avec k8s/ :
#   - pas de "namespace:" : Helm crée les objets dans le namespace passé avec -n ;
#   - les valeurs variables (image, réplicas, ressources...) viennent de values.yaml ;
#   - les blocs répétitifs (labels, image, affinité) sont générés par _helpers.tpl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  # labels project/app/tier générés par _helpers.tpl ; nindent = retour à la ligne + indentation
  labels: {{- include "dotnetgigs.labels" (list "identity-api" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.identityApi.replicas }}   # 2 par défaut (haute disponibilité)
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels: {{- include "dotnetgigs.labels" (list "identity-api" "backend") | nindent 8 }}
    spec:
      # affinité imposée par le sujet : identity.api => user.data (même nœud que Redis si possible)
      {{- include "dotnetgigs.affinity" (list "user-data") | nindent 6 }}
      imagePullSecrets:          # identifiants Docker Hub (repo privé), nom lu dans values.yaml
      - name: {{ .Values.image.pullSecret }}
      containers:
      - name: identity-api
        # image = <image.repository>:<tag>, ex. nicoter04/dotnetgigs_bd:jobs-api
        image: {{ include "dotnetgigs.image" (list $ .Values.identityApi.tag) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        env:
        - name: RedisHost               # Service Redis (user-data.yaml)
          value: user-data:6379
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        # ressources lues dans values.yaml ; toYaml recopie le bloc tel quel
        resources: {{- toYaml .Values.identityApi.resources | nindent 10 }}
        # readiness : prêt à recevoir du trafic ; liveness : redémarrage si plus de réponse
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
# Service interne ClusterIP (non exposé à l'extérieur)
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  labels: {{- include "dotnetgigs.labels" (list "identity-api" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: identity-api
  ports:
  - port: 80
    targetPort: 80
