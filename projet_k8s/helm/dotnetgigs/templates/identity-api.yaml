# identity.api : API des utilisateurs (Redis + RabbitMQ)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  labels: {{- include "dotnetgigs.labels" (list "identity-api" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.identityApi.replicas }}
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels: {{- include "dotnetgigs.labels" (list "identity-api" "backend") | nindent 8 }}
    spec:
      {{- include "dotnetgigs.affinity" (list "user-data") | nindent 6 }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      containers:
      - name: identity-api
        image: {{ include "dotnetgigs.image" (list $ .Values.identityApi.tag) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        env:
        - name: RedisHost
          value: user-data:6379
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        resources: {{- toYaml .Values.identityApi.resources | nindent 10 }}
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  labels: {{- include "dotnetgigs.labels" (list "identity-api" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: identity-api
  ports:
  - port: 80
    targetPort: 80
