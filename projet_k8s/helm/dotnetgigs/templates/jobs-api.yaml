# jobs.api : API des offres d'emploi (SQL Server + RabbitMQ), ServiceAccount dédié (rbac.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  labels: {{- include "dotnetgigs.labels" (list "jobs-api" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.jobsApi.replicas }}
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels: {{- include "dotnetgigs.labels" (list "jobs-api" "backend") | nindent 8 }}
    spec:
      serviceAccountName: jobs-api-sa
      {{- include "dotnetgigs.affinity" (list "sql-data") | nindent 6 }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      containers:
      - name: jobs-api
        image: {{ include "dotnetgigs.image" (list $ .Values.jobsApi.tag) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        env:
        - name: ConnectionString
          valueFrom: { secretKeyRef: { name: dotnetgigs-secrets, key: JOBS_CONNECTION } }
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        resources: {{- toYaml .Values.jobsApi.resources | nindent 10 }}
        readinessProbe:
          httpGet: { path: /api/jobs, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
  labels: {{- include "dotnetgigs.labels" (list "jobs-api" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: jobs-api
  ports:
  - port: 80
    targetPort: 80
