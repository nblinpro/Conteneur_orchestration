# jobs.api : API des offres d'emploi (SQL Server + RabbitMQ), ServiceAccount dédié (rbac.yaml)
# Modèle Helm équivalent à k8s/06-jobs-api.yml (voir ce fichier pour l'explication détaillée de chaque champ).
# Différences avec k8s/ :
#   - pas de "namespace:" : Helm crée les objets dans le namespace passé avec -n ;
#   - les valeurs variables (image, réplicas, ressources...) viennent de values.yaml ;
#   - les blocs répétitifs (labels, image, affinité) sont générés par _helpers.tpl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  # labels project/app/tier générés par _helpers.tpl ; nindent = retour à la ligne + indentation
  labels: {{- include "dotnetgigs.labels" (list "jobs-api" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.jobsApi.replicas }}   # 2 par défaut (haute disponibilité)
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels: {{- include "dotnetgigs.labels" (list "jobs-api" "backend") | nindent 8 }}
    spec:
      serviceAccountName: jobs-api-sa   # compte aux droits restreints (rbac.yaml)
      # affinité imposée par le sujet : jobs.api => sql.data (même nœud si possible)
      {{- include "dotnetgigs.affinity" (list "sql-data") | nindent 6 }}
      imagePullSecrets:          # identifiants Docker Hub (repo privé), nom lu dans values.yaml
      - name: {{ .Values.image.pullSecret }}
      containers:
      - name: jobs-api
        # image = <image.repository>:<tag>, ex. nicoter04/dotnetgigs_bd:jobs-api
        image: {{ include "dotnetgigs.image" (list $ .Values.jobsApi.tag) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        env:
        - name: ConnectionString        # chaîne de connexion SQL, lue dans le Secret (secret.yaml)
          valueFrom: { secretKeyRef: { name: dotnetgigs-secrets, key: JOBS_CONNECTION } }
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        # ressources lues dans values.yaml ; toYaml recopie le bloc tel quel
        resources: {{- toYaml .Values.jobsApi.resources | nindent 10 }}
        # readiness : prêt à recevoir du trafic ; liveness : redémarrage si plus de réponse
        readinessProbe:
          httpGet: { path: /api/jobs, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
# Service interne ClusterIP (non exposé à l'extérieur)
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
  labels: {{- include "dotnetgigs.labels" (list "jobs-api" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: jobs-api
  ports:
  - port: 80
    targetPort: 80
