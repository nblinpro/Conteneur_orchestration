{{- if .Values.networkPolicy.enabled }}
# Règles réseau : tout est bloqué par défaut, puis on autorise uniquement les liens nécessaires.
#   ingress-nginx -> web -> identity-api / jobs-api / applicants-api
#   jobs-api, applicants-api -> sql-data
#   identity-api -> user-data
#   les 3 API -> rabbitmq

# Bloque tout trafic entrant vers les pods du namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# web : joignable uniquement par le contrôleur ingress (namespace ingress-nginx)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
    ports:
    - port: 80
---
# Les 3 API : joignables uniquement par web
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-web
spec:
  podSelector:
    matchExpressions:
    - { key: app, operator: In, values: [identity-api, jobs-api, applicants-api] }
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels: { app: web }
    ports:
    - port: 80
---
# sql-data : joignable uniquement par jobs-api et applicants-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sql-from-api
spec:
  podSelector:
    matchLabels: { app: sql-data }
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app, operator: In, values: [jobs-api, applicants-api] }
    ports:
    - port: 1433
---
# user-data (Redis) : joignable uniquement par identity-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-identity
spec:
  podSelector:
    matchLabels: { app: user-data }
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels: { app: identity-api }
    ports:
    - port: 6379
---
# rabbitmq : joignable uniquement par les 3 API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-api
spec:
  podSelector:
    matchLabels: { app: rabbitmq }
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app, operator: In, values: [identity-api, jobs-api, applicants-api] }
    ports:
    - port: 5672
{{- end }}
