# Mot de passe SQL Server et chaînes de connexion des API
apiVersion: v1
kind: Secret
metadata:
  name: dotnetgigs-secrets
  labels:
    project: dotnetgigs
type: Opaque
stringData:
  SA_PASSWORD: {{ .Values.sql.saPassword | quote }}
  JOBS_CONNECTION: "Server=sql-data;User=sa;Password={{ .Values.sql.saPassword }};Database=dotnetgigs.jobs;"
  APPLICANTS_CONNECTION: "Server=sql-data;User=sa;Password={{ .Values.sql.saPassword }};Database=dotnetgigs.applicants;"
