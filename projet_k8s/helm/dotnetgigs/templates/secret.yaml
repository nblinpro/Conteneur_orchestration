# Mot de passe SQL Server et chaînes de connexion des API
# (équivalent de k8s/01-secret.yml ; le mot de passe vient de values.yaml : sql.saPassword).
# Pas de "namespace:" dans les modèles : Helm crée tout dans le namespace passé avec -n.
apiVersion: v1
kind: Secret
metadata:
  name: dotnetgigs-secrets
  labels:
    project: dotnetgigs
type: Opaque
stringData:
  SA_PASSWORD: {{ .Values.sql.saPassword | quote }}    # "quote" entoure la valeur de guillemets (le @ casserait le YAML)
  JOBS_CONNECTION: "Server=sql-data;User=sa;Password={{ .Values.sql.saPassword }};Database=dotnetgigs.jobs;"
  APPLICANTS_CONNECTION: "Server=sql-data;User=sa;Password={{ .Values.sql.saPassword }};Database=dotnetgigs.applicants;"
