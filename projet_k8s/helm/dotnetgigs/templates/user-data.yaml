# Redis : stockage des utilisateurs pour identity-api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-data
  labels: {{- include "dotnetgigs.labels" (list "user-data" "data") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-data
  template:
    metadata:
      labels: {{- include "dotnetgigs.labels" (list "user-data" "data") | nindent 8 }}
    spec:
      containers:
      - name: user-data
        image: {{ .Values.userData.image }}
        ports:
        - containerPort: 6379
        resources: {{- toYaml .Values.userData.resources | nindent 10 }}
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 6379 }
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-data
  labels: {{- include "dotnetgigs.labels" (list "user-data" "data") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: user-data
  ports:
  - port: 6379
    targetPort: 6379
