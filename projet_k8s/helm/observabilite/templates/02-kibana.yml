# Kibana : le site web pour chercher dans les logs et faire des dashboards.
# Réglages (image, ressources) : values.yaml, section kibana.
# Accès : kubectl port-forward --address 0.0.0.0 -n observabilite svc/kibana 5601:5601
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        tier: logging
    spec:
      containers:
      - name: kibana
        image: {{ .Values.kibana.image }}
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: http://elasticsearch:9200    # le Service Elasticsearch (même namespace)
        # Ressources lues dans values.yaml (kibana.resources)
        resources:
          {{- toYaml .Values.kibana.resources | nindent 10 }}
        # Prêt seulement quand l'API de Kibana répond : Kibana ouvre son port bien avant
        # d'avoir fini de démarrer (il répond alors "not ready yet"), un test TCP ne suffit pas
        readinessProbe:
          httpGet: { path: /api/status, port: 5601 }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 5601 }
          initialDelaySeconds: 120            # Kibana démarre lentement
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app: kibana
spec:
  selector:
    app: kibana
  ports:
  - port: 5601
