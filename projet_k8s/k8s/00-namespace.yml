# =============================================================================
# 00 - NAMESPACE
# =============================================================================
# Un namespace est un "dossier" logique dans le cluster : toutes les ressources
# de l'application (pods, services, secrets...) y sont créées.
# Avantages :
#   - isole le projet des autres applications du cluster (kube-system, ingress-nginx...) ;
#   - permet de tout supprimer d'un coup : kubectl delete namespace dotnetgigs ;
#   - les NetworkPolicies et le RBAC (Role) s'appliquent par namespace.
#
# Les fichiers sont numérotés (00, 01, 02...) pour être appliqués dans l'ordre :
# le namespace doit exister avant tout le reste.
apiVersion: v1
kind: Namespace
metadata:
  name: dotnetgigs
  labels:
    project: dotnetgigs     # étiquette commune à toutes les ressources du projet
