# Mot de passe SQL Server et chaînes de connexion des API.
# Le mot de passe est imposé par l'image sql-data (Database/Dockerfile et SqlCmdStartup.sh).
apiVersion: v1
kind: Secret
metadata:
  name: dotnetgigs-secrets
  namespace: dotnetgigs
  labels:
    project: dotnetgigs
type: Opaque
stringData:
  SA_PASSWORD: "Pass@word"
  JOBS_CONNECTION: "Server=sql-data;User=sa;Password=Pass@word;Database=dotnetgigs.jobs;"
  APPLICANTS_CONNECTION: "Server=sql-data;User=sa;Password=Pass@word;Database=dotnetgigs.applicants;"
