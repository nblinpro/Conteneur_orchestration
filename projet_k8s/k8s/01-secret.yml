# =============================================================================
# 01 - SECRET APPLICATIF
# =============================================================================
# Un Secret stocke des données sensibles (mots de passe, chaînes de connexion)
# séparément des Deployments : les pods les lisent sous forme de variables
# d'environnement (voir "secretKeyRef" dans 03, 06 et 07).
#
# Le mot de passe "Pass@word" est imposé par l'image sql-data fournie par le prof :
# il est écrit en dur dans Database/Dockerfile et SqlCmdStartup.sh, qui créent les bases.
#
# "stringData" permet d'écrire les valeurs en clair : Kubernetes les encode
# lui-même en base64 dans le champ "data" au moment de la création.
apiVersion: v1
kind: Secret
metadata:
  name: dotnetgigs-secrets
  namespace: dotnetgigs
  labels:
    project: dotnetgigs
type: Opaque                # Secret générique (clé -> valeur)
stringData:
  # Mot de passe de l'administrateur SQL Server (compte "sa")
  SA_PASSWORD: "Pass@word"
  # Chaînes de connexion lues par les API (variable ConnectionString du code .NET).
  # "Server=sql-data" = nom du Service SQL (03-sql-data.yml), résolu par le DNS du cluster.
  # Les noms de bases (dotnetgigs.jobs / dotnetgigs.applicants) viennent du script SQL fourni.
  JOBS_CONNECTION: "Server=sql-data;User=sa;Password=Pass@word;Database=dotnetgigs.jobs;"
  APPLICANTS_CONNECTION: "Server=sql-data;User=sa;Password=Pass@word;Database=dotnetgigs.applicants;"
