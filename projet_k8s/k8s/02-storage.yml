# =============================================================================
# 02 - STOCKAGE PERSISTANT DE SQL SERVER
# =============================================================================
# Un pod est éphémère : s'il est recréé, son disque interne est perdu.
# Pour que les bases SQL survivent à un redémarrage, on demande un volume
# persistant avec un PersistentVolumeClaim (PVC = "demande de disque").
#
# On ne crée pas de PersistentVolume (PV) à la main : minikube possède une
# StorageClass "standard" par défaut qui crée automatiquement le PV quand le
# PVC est demandé (provisionnement dynamique). Sur AKS, ce serait un disque Azure.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql-data-pvc        # nom référencé par le Deployment sql-data (03)
  namespace: dotnetgigs
  labels:
    project: dotnetgigs
    app: sql-data
spec:
  accessModes:
    - ReadWriteOnce         # monté en lecture/écriture par un seul nœud à la fois
  resources:
    requests:
      storage: 2Gi          # taille du disque : largement suffisant pour les 2 bases de démo
