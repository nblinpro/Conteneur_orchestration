# Redis : stockage des utilisateurs pour identity-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-data
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: user-data, tier: data }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-data
  template:
    metadata:
      labels: { project: dotnetgigs, app: user-data, tier: data }
    spec:
      containers:
      - name: user-data
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests: { cpu: 4m, memory: 500Mi, ephemeral-storage: 50Mi }
          limits:   { cpu: 500m, memory: 1Gi, ephemeral-storage: 500Mi }
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 6379 }
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-data
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: user-data, tier: data }
spec:
  type: ClusterIP
  selector:
    app: user-data
  ports:
  - port: 6379
    targetPort: 6379
