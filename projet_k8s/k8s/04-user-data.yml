# =============================================================================
# 04 - USER-DATA : Redis
# =============================================================================
# Base clé/valeur en mémoire utilisée par identity-api pour stocker les
# utilisateurs (docker-compose fourni : service "user.data", image redis).
# Image publique officielle : pas besoin du repo privé ni d'imagePullSecrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-data           # "user.data" dans le docker-compose : le point est interdit
                            # dans un nom de Service Kubernetes, d'où le tiret
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: user-data, tier: data }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-data
  template:
    metadata:
      labels: { project: dotnetgigs, app: user-data, tier: data }
    spec:
      containers:
      - name: user-data
        image: redis:7-alpine     # version 7, variante alpine (image légère)
        ports:
        - containerPort: 6379     # port standard de Redis
        # Requests imposées par le sujet : CPU 4m, MEM 500Mi.
        # Le sujet ne donne pas de limite pour user-data : on en fixe une raisonnable,
        # car chaque pod doit avoir une limite.
        resources:
          requests: { cpu: 4m, memory: 500Mi, ephemeral-storage: 50Mi }
          limits:   { cpu: 500m, memory: 1Gi, ephemeral-storage: 500Mi }
        # Readiness : exécute "redis-cli ping" dans le conteneur (répond PONG si Redis est prêt)
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          periodSeconds: 10
        # Liveness : le port 6379 répond-il ? Sinon redémarrage du conteneur
        livenessProbe:
          tcpSocket: { port: 6379 }
          initialDelaySeconds: 10
          periodSeconds: 20
---
# Service interne : identity-api s'y connecte via RedisHost=user-data:6379 (08)
apiVersion: v1
kind: Service
metadata:
  name: user-data
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: user-data, tier: data }
spec:
  type: ClusterIP
  selector:
    app: user-data
  ports:
  - port: 6379
    targetPort: 6379
