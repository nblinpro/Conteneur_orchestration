# jobs.api : API des offres d'emploi (SQL Server + RabbitMQ).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: jobs-api, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels: { project: dotnetgigs, app: jobs-api, tier: backend }
    spec:
      serviceAccountName: jobs-api-sa   # compte aux droits restreints (12-rbac.yml)
      affinity:
        podAffinity:              # au plus près de la base de données
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: sql-data }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:          # identifiants Docker Hub (repo privé)
      - name: dockerhub-secret
      containers:
      - name: jobs-api
        image: nicoter04/dotnetgigs_bd:jobs-api
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ConnectionString
          valueFrom: { secretKeyRef: { name: dotnetgigs-secrets, key: JOBS_CONNECTION } }
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        resources:
          requests: { cpu: 500m, memory: 500Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1500Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /api/jobs, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: jobs-api, tier: backend }
spec:
  type: ClusterIP
  selector:
    app: jobs-api
  ports:
  - port: 80
    targetPort: 80
