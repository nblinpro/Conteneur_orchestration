# =============================================================================
# 06 - JOBS-API : API REST des offres d'emploi
# =============================================================================
# Application ASP.NET Core (appscore/Services/Jobs.Api).
# Dépendances : sql-data (base dotnetgigs.jobs) et rabbitmq.
# Appelée par : web.
# Particularité : utilise le ServiceAccount dédié jobs-api-sa (RBAC, voir 12-rbac.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api            # "jobs.api" dans le docker-compose (point interdit dans un nom de Service)
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: jobs-api, tier: backend }
spec:
  replicas: 2               # 2 pods : si l'un tombe, l'autre continue de répondre (haute disponibilité)
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels: { project: dotnetgigs, app: jobs-api, tier: backend }
    spec:
      serviceAccountName: jobs-api-sa   # compte aux droits restreints (12-rbac.yml)
      # Affinité imposée par le sujet : jobs.api => sql.data.
      # Le scheduler essaie de placer ce pod sur le même nœud (topologyKey = hostname)
      # qu'un pod "app: sql-data" pour réduire la latence réseau.
      # "preferred" = préférence, pas obligation : si c'est impossible, le pod démarre quand même.
      affinity:
        podAffinity:              # au plus près de la base de données
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100           # importance de la préférence (1 à 100)
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: sql-data }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:          # identifiants Docker Hub (repo privé)
      - name: dockerhub-secret
      containers:
      - name: jobs-api
        image: nicoter04/dotnetgigs_bd:jobs-api
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # Variables d'environnement reprises du docker-compose fourni.
        # ASP.NET Core lit les variables d'environnement par-dessus appsettings.json.
        env:
        - name: ConnectionString        # chaîne de connexion SQL, lue dans le Secret
          valueFrom: { secretKeyRef: { name: dotnetgigs-secrets, key: JOBS_CONNECTION } }
        - name: HostRabbitmq            # nom du Service RabbitMQ (05)
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default   # "__" = niveau d'imbrication JSON :
          value: Information                          # Logging:Console:LogLevel:Default (logs pour EFK)
        # Ressources imposées par le sujet : request CPU 0.5 / MEM 500Mi, limit CPU 1 / MEM 1500Mi
        resources:
          requests: { cpu: 500m, memory: 500Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1500Mi, ephemeral-storage: 1Gi }
        # Readiness : requête HTTP GET sur /api/jobs ; prêt seulement si l'API répond
        # (donc si elle arrive aussi à joindre SQL Server)
        readinessProbe:
          httpGet: { path: /api/jobs, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        # Liveness : simple test du port 80. On ne teste pas /api/jobs ici, sinon une panne
        # de SQL ferait redémarrer l'API en boucle alors qu'elle n'est pas en cause.
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
# Service interne : web l'appelle via http://jobs-api (variable ApiSettings__JobsApiUrl).
# Le Service répartit les requêtes entre les 2 pods (load balancing).
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: jobs-api, tier: backend }
spec:
  type: ClusterIP
  selector:
    app: jobs-api
  ports:
  - port: 80
    targetPort: 80
