# applicants.api : API des candidats (SQL Server + RabbitMQ).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applicants-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: applicants-api, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels:
      app: applicants-api
  template:
    metadata:
      labels: { project: dotnetgigs, app: applicants-api, tier: backend }
    spec:
      affinity:
        podAffinity:              # au plus près de la base de données
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: sql-data }
              topologyKey: kubernetes.io/hostname
      containers:
      - name: applicants-api
        image: dotnetgigs/applicants-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ConnectionString
          valueFrom: { secretKeyRef: { name: dotnetgigs-secrets, key: APPLICANTS_CONNECTION } }
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        resources:
          requests: { cpu: 500m, memory: 500Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1500Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /api/applicants, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: applicants-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: applicants-api, tier: backend }
spec:
  type: ClusterIP
  selector:
    app: applicants-api
  ports:
  - port: 80
    targetPort: 80
