# =============================================================================
# 07 - APPLICANTS-API : API REST des candidats
# =============================================================================
# Application ASP.NET Core (appscore/Services/Applicants.Api).
# Dépendances : sql-data (base dotnetgigs.applicants) et rabbitmq.
# Même structure que jobs-api (06) : voir ce fichier pour le détail des champs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applicants-api      # "applicants.api" dans le docker-compose
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: applicants-api, tier: backend }
spec:
  replicas: 2               # haute disponibilité
  selector:
    matchLabels:
      app: applicants-api
  template:
    metadata:
      labels: { project: dotnetgigs, app: applicants-api, tier: backend }
    spec:
      # Affinité imposée par le sujet : applicants.api => sql.data (même nœud si possible)
      affinity:
        podAffinity:              # au plus près de la base de données
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: sql-data }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:          # identifiants Docker Hub (repo privé)
      - name: dockerhub-secret
      containers:
      - name: applicants-api
        image: nicoter04/dotnetgigs_bd:applicants-api
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ConnectionString        # chaîne de connexion vers la base dotnetgigs.applicants
          valueFrom: { secretKeyRef: { name: dotnetgigs-secrets, key: APPLICANTS_CONNECTION } }
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default   # logs de niveau Information sur la sortie standard
          value: Information
        # Ressources imposées par le sujet : request 0.5 CPU / 500Mi, limit 1 CPU / 1500Mi
        resources:
          requests: { cpu: 500m, memory: 500Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1500Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /api/applicants, port: 80 }   # l'API répond = prête
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }                        # le processus écoute = vivant
          initialDelaySeconds: 30
          periodSeconds: 20
---
# Service interne (port 80) : non exposé à l'extérieur
apiVersion: v1
kind: Service
metadata:
  name: applicants-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: applicants-api, tier: backend }
spec:
  type: ClusterIP
  selector:
    app: applicants-api
  ports:
  - port: 80
    targetPort: 80
