# identity.api : API des utilisateurs (Redis + RabbitMQ).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: identity-api, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels: { project: dotnetgigs, app: identity-api, tier: backend }
    spec:
      affinity:
        podAffinity:              # au plus près de Redis
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: user-data }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:          # identifiants Docker Hub (repo privé)
      - name: dockerhub-secret
      containers:
      - name: identity-api
        image: nicoter04/dotnetgigs_bd:identity-api
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: RedisHost
          value: user-data:6379
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        resources:
          requests: { cpu: 500m, memory: 500Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1500Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: identity-api, tier: backend }
spec:
  type: ClusterIP
  selector:
    app: identity-api
  ports:
  - port: 80
    targetPort: 80
