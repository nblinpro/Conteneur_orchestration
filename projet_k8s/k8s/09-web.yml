# web : site MVC qui appelle identity-api et jobs-api. Seule app exposée à l'extérieur (via l'Ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels: { project: dotnetgigs, app: web, tier: frontend }
    spec:
      affinity:
        podAffinity:              # au plus près des API qu'il appelle
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: jobs-api }
              topologyKey: kubernetes.io/hostname
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: applicants-api }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:          # identifiants Docker Hub (repo privé)
      - name: dockerhub-secret
      containers:
      - name: web
        image: nicoter04/dotnetgigs_bd:web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ApiSettings__IdentityApiUrl   # remplace http://identity.api (point interdit dans un nom de Service)
          value: http://identity-api
        - name: ApiSettings__JobsApiUrl
          value: http://jobs-api
        - name: Logging__LogLevel__Default
          value: Information
        resources:
          requests: { cpu: 4m, memory: 900Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 2000Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /Home/About, port: 80 }   # page sans appel aux API
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
# Autoscaling de web selon le CPU.
# Cible en valeur absolue (AverageValue) et non en % : avec une request de 4m imposée,
# un pourcentage serait toujours au-dessus de la cible, même sans charge.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 3            # chaque pod web réserve 900Mi : limité par la mémoire du cluster
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: 50m   # au-delà de 50m de CPU par pod en moyenne : ajout d'un pod
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
