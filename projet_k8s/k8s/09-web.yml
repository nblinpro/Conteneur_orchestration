# web : site MVC qui appelle identity-api et jobs-api. Seule app exposée à l'extérieur (via l'Ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels: { project: dotnetgigs, app: web, tier: frontend }
    spec:
      affinity:
        podAffinity:              # au plus près des API qu'il appelle
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: jobs-api }
              topologyKey: kubernetes.io/hostname
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: applicants-api }
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web
        image: dotnetgigs/web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: ApiSettings__IdentityApiUrl   # remplace http://identity.api (point interdit dans un nom de Service)
          value: http://identity-api
        - name: ApiSettings__JobsApiUrl
          value: http://jobs-api
        - name: Logging__LogLevel__Default
          value: Information
        resources:
          requests: { cpu: 4m, memory: 900Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 2000Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /Home/About, port: 80 }   # page sans appel aux API
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
