# =============================================================================
# 09 - WEB : site web (ASP.NET Core MVC)
# =============================================================================
# Application appscore/Web. Seule application exposée à l'extérieur, et
# uniquement via l'Ingress HTTPS (10-ingress.yml) : son Service reste ClusterIP.
# Dans le code, web appelle identity-api (connexion) et jobs-api (liste des offres).
#
# Ce fichier contient 3 objets : Deployment, HorizontalPodAutoscaler, Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  replicas: 2               # valeur de départ ; ensuite c'est l'HPA (plus bas) qui ajuste entre 2 et 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels: { project: dotnetgigs, app: web, tier: frontend }
    spec:
      # Affinité imposée par le sujet : web => jobs.api et applicants.api.
      # Deux préférences de poids égal : le scheduler favorise un nœud qui héberge
      # un pod jobs-api et/ou un pod applicants-api.
      affinity:
        podAffinity:              # au plus près des API qu'il appelle
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: jobs-api }
              topologyKey: kubernetes.io/hostname
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: applicants-api }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:          # identifiants Docker Hub (repo privé)
      - name: dockerhub-secret
      containers:
      - name: web
        image: nicoter04/dotnetgigs_bd:web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # Les URL des API sont dans appsettings.json (section ApiSettings). On les remplace
        # par variables d'environnement : ApiSettings__X = clé ApiSettings:X en JSON.
        env:
        - name: ApiSettings__IdentityApiUrl   # remplace http://identity.api (point interdit dans un nom de Service)
          value: http://identity-api
        - name: ApiSettings__JobsApiUrl
          value: http://jobs-api
        - name: Logging__LogLevel__Default    # logs de niveau Information (exploités par EFK)
          value: Information
        # Ressources imposées par le sujet : request CPU 4m / MEM 900Mi, limit CPU 1 / MEM 2000Mi
        # (le sujet écrit "4 Mo" pour le CPU : interprété comme 4m = 4 millièmes de cœur)
        resources:
          requests: { cpu: 4m, memory: 900Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 2000Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /Home/About, port: 80 }   # page sans appel aux API
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 20
---
# HorizontalPodAutoscaler (sujet, partie Scalabilité) : ajoute ou retire des pods web
# selon la consommation CPU mesurée par metrics-server (addon minikube).
# Cible en valeur absolue (AverageValue) et non en % : avec une request de 4m imposée,
# un pourcentage serait toujours au-dessus de la cible, même sans charge.
# Démo : kubectl apply -f scripts/load-generator.yml puis kubectl get hpa -n dotnetgigs -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  scaleTargetRef:           # l'objet dont l'HPA modifie le nombre de réplicas
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2            # jamais moins de 2 pods (haute disponibilité)
  maxReplicas: 3            # chaque pod web réserve 900Mi : limité par la mémoire du cluster
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: 50m   # au-delà de 50m de CPU par pod en moyenne : ajout d'un pod
---
# Service interne de web : c'est lui que l'Ingress (10) cible.
# Pas de type LoadBalancer/NodePort : l'accès externe passe uniquement par l'Ingress HTTPS.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: web, tier: frontend }
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
