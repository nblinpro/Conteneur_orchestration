# Kibana : interface de recherche et de dashboards sur les logs stockés dans Elasticsearch.
# Installation : kubectl apply -f logging/kibana.yaml
# Accès        : kubectl port-forward --address 0.0.0.0 -n logging svc/kibana 5601:5601
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels: { project: dotnetgigs, app: kibana, tier: logging }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels: { project: dotnetgigs, app: kibana, tier: logging }
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.15.3
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: http://elasticsearch:9200
        resources:
          requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi }
        readinessProbe:
          httpGet: { path: /api/status, port: 5601 }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 5601 }
          initialDelaySeconds: 120
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
  labels: { project: dotnetgigs, app: kibana, tier: logging }
spec:
  type: ClusterIP
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
