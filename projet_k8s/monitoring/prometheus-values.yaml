# Configuration du chart prometheus-community/prometheus (namespace monitoring).
# Installation :
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/prometheus --version 29.47.2 \
#     -n monitoring --create-namespace -f monitoring/prometheus-values.yaml
#
# Métriques collectées (jobs de scrape fournis par le chart) :
#   - kubernetes-apiservers      : plan de contrôle (apiserver_request_total, latences...)
#   - kubernetes-nodes           : kubelet
#   - kubernetes-nodes-cadvisor  : CPU / mémoire / réseau de chaque conteneur (pods)
#   - kube-state-metrics         : état du cluster (pods, deployments, HPA, nœuds...)
#   - node-exporter              : ressources des nœuds (CPU, RAM, disque)

server:
  retention: "2d"                # 2 jours d'historique suffisent pour le projet
  persistentVolume:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

# Composants inutiles pour le projet : désactivés pour économiser la mémoire
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }

prometheus-node-exporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits:   { cpu: 100m, memory: 64Mi }
