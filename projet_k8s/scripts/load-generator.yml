# Générateur de charge pour la démo de l'HPA de web.
# Il passe par l'Ingress en HTTPS, comme un vrai visiteur (les NetworkPolicies
# n'autorisent web que depuis le contrôleur ingress).
# Lancer  : kubectl apply -f scripts/load-generator.yml
# Suivre  : kubectl get hpa -n dotnetgigs -w
# Arrêter : kubectl delete -f scripts/load-generator.yml
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: dotnetgigs
  labels: { project: dotnetgigs, app: load-generator }
spec:
  restartPolicy: Never
  containers:
  - name: load-generator
    image: curlimages/curl:8.11.1
    command:
    - /bin/sh
    - -c
    - |
      # 20 boucles en parallèle vers la page d'accueil (web -> jobs-api -> SQL)
      for i in $(seq 1 20); do
        (
          while true; do
            curl -sk -o /dev/null -H "Host: dotnetgigs.local" \
              https://ingress-nginx-controller.ingress-nginx.svc.cluster.local/
          done
        ) &
      done
      wait
    resources:
      requests: { cpu: 100m, memory: 32Mi, ephemeral-storage: 10Mi }
      limits:   { cpu: "1", memory: 128Mi, ephemeral-storage: 50Mi }
