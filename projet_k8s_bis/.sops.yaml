# Configuration de SOPS (chiffrement des secrets) pour ce projet.
# Tout fichier nommé *.enc.yaml est chiffré avec la clé publique age ci-dessous.
# Seul le détenteur de la clé privée correspondante (~/.config/sops/age/keys.txt,
# hors du dépôt Git) peut le déchiffrer.
creation_rules:
  - path_regex: .*\.enc\.yaml$
    age: age1qp4f9ham96xgv9q3tr7z60m8ky56hsnrau39cqhnta4vntr09pyss68jj7
