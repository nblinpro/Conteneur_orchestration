<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.5;rx:8}
      .t{font-size:14px;font-weight:bold;fill:#0f172a;text-anchor:middle}
      .s{font-size:11px;fill:#475569;text-anchor:middle}
      .ns{font-size:13px;font-weight:bold;fill:#334155}
      .l{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .ext{stroke:#15803d;stroke-width:3;fill:none;marker-end:url(#ae)}
      .obs{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#ag)}
      .lt{font-size:11px;fill:#334155}
    </style>
  </defs>

  <rect width="1400" height="920" fill="#f8fafc"/>
  <text x="700" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">dotnetgigs : architecture Kubernetes</text>

  <!-- Externe -->
  <rect class="box" x="20" y="370" width="160" height="80" style="fill:#dcfce7;stroke:#15803d"/>
  <text class="t" x="100" y="402">Utilisateur</text>
  <text class="s" x="100" y="420">navigateur</text>
  <text class="s" x="100" y="436">https://dotnetgigs.local</text>

  <rect class="box" x="20" y="560" width="160" height="80" style="fill:#e0f2fe;stroke:#0369a1"/>
  <text class="t" x="100" y="590">Docker Hub</text>
  <text class="s" x="100" y="608">repo privé</text>
  <text class="s" x="100" y="624">nicoter04/dotnetgigs_bd</text>

  <rect class="box" x="20" y="720" width="160" height="80" style="fill:#f1f5f9"/>
  <text class="t" x="100" y="750">Administrateur</text>
  <text class="s" x="100" y="768">port-forward vers</text>
  <text class="s" x="100" y="784">Prometheus / Kibana</text>

  <!-- Cluster -->
  <rect x="200" y="55" width="1185" height="850" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="215" y="78" font-size="15" font-weight="bold" fill="#3730a3">Cluster Kubernetes : minikube (1 nœud, 4 CPU, 11 Go)</text>

  <!-- ns ingress-nginx -->
  <rect x="215" y="330" width="175" height="160" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 3"/>
  <text class="ns" x="225" y="350">ns traefik</text>
  <rect class="box" x="230" y="370" width="145" height="90"/>
  <text class="t" x="302" y="398">Contrôleur</text>
  <text class="t" x="302" y="416">Traefik</text>
  <text class="s" x="302" y="436">chart traefik/traefik</text>
  <text class="s" x="302" y="450">:80 → 301, :443 TLS</text>

  <!-- ns dotnetgigs -->
  <rect x="405" y="90" width="965" height="560" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#4f46e5" stroke-dasharray="5 3"/>
  <text class="ns" x="415" y="110">ns dotnetgigs (chart Helm helm/dotnetgigs) : NetworkPolicies : sql-data ← API uniquement, identity-api ← web uniquement</text>

  <rect class="box" x="420" y="365" width="140" height="80"/>
  <text class="t" x="490" y="392">Ingress</text>
  <text class="s" x="490" y="410">dotnetgigs.local</text>
  <text class="s" x="490" y="426">Secret TLS auto-signé</text>

  <rect class="box" x="590" y="345" width="160" height="120" style="fill:#fef9c3;stroke:#a16207"/>
  <text class="t" x="670" y="373">web</text>
  <text class="s" x="670" y="391">ASP.NET MVC</text>
  <text class="s" x="670" y="407">2 → 3 pods (HPA CPU)</text>
  <text class="s" x="670" y="423">Service web:80</text>
  <text class="s" x="670" y="439">tier: frontend</text>

  <rect class="box" x="800" y="135" width="200" height="90" style="fill:#e0e7ff"/>
  <text class="t" x="900" y="162">identity-api</text>
  <text class="s" x="900" y="180">API REST · 2 pods</text>
  <text class="s" x="900" y="196">Service identity-api:80</text>
  <text class="s" x="900" y="212">tier: backend</text>

  <rect class="box" x="800" y="350" width="200" height="110" style="fill:#e0e7ff"/>
  <text class="t" x="900" y="377">jobs-api</text>
  <text class="s" x="900" y="395">API REST · 2 pods</text>
  <text class="s" x="900" y="411">Service jobs-api:80</text>
  <text class="s" x="900" y="427">ServiceAccount jobs-api-sa</text>
  <text class="s" x="900" y="443">(RBAC : lecture ConfigMaps)</text>

  <rect class="box" x="800" y="530" width="200" height="90" style="fill:#e0e7ff"/>
  <text class="t" x="900" y="557">applicants-api</text>
  <text class="s" x="900" y="575">API REST · 2 pods</text>
  <text class="s" x="900" y="591">Service applicants-api:80</text>
  <text class="s" x="900" y="607">tier: backend</text>

  <rect class="box" x="1110" y="135" width="240" height="90" style="fill:#fee2e2;stroke:#b91c1c"/>
  <text class="t" x="1230" y="162">user-data (Redis)</text>
  <text class="s" x="1230" y="180">Service user-data:6379</text>
  <text class="s" x="1230" y="196">tier: data</text>

  <rect class="box" x="1110" y="350" width="240" height="90" style="fill:#fae8ff;stroke:#86198f"/>
  <text class="t" x="1230" y="377">rabbitmq</text>
  <text class="s" x="1230" y="395">bus de messages (MassTransit)</text>
  <text class="s" x="1230" y="411">Service rabbitmq:5672</text>
  <text class="s" x="1230" y="427">tier: messaging</text>

  <rect class="box" x="1110" y="520" width="240" height="110" style="fill:#fee2e2;stroke:#b91c1c"/>
  <text class="t" x="1230" y="547">sql-data (SQL Server)</text>
  <text class="s" x="1230" y="565">Service sql-data:1433</text>
  <text class="s" x="1230" y="581">bases jobs + applicants</text>
  <text class="s" x="1230" y="597">PVC sql-data-pvc (2 Go)</text>
  <text class="s" x="1230" y="613">tier: data</text>

  <!-- Flux externes -->
  <path class="ext" d="M180,410 L228,410"/>
  <text class="lt" x="184" y="400" fill="#15803d">HTTPS</text>
  <path class="ext" d="M375,410 L418,405"/>
  <path class="ext" d="M560,405 L588,405"/>

  <!-- Flux internes -->
  <path class="l" d="M750,380 L798,195"/>
  <text class="lt" x="735" y="285">HTTP</text>
  <path class="l" d="M750,405 L798,405"/>
  <path class="l" d="M750,430 L798,560" stroke-dasharray="4 3"/>
  <text class="lt" x="700" y="520">(appel prévu par le sujet)</text>
  <path class="l" d="M1000,180 L1108,180"/>
  <text class="lt" x="1015" y="172">Redis</text>
  <path class="l" d="M1000,215 L1108,370"/>
  <path class="l" d="M1000,395 L1108,395"/>
  <text class="lt" x="1020" y="387">AMQP</text>
  <path class="l" d="M1000,550 L1108,420"/>
  <path class="l" d="M1000,440 L1108,560"/>
  <path class="l" d="M1000,590 L1108,590"/>
  <text class="lt" x="1025" y="608">SQL 1433</text>

  <!-- Docker Hub -->
  <path class="obs" d="M180,600 L403,600" style="stroke:#0369a1;marker-end:url(#a)"/>
  <text class="lt" x="200" y="590" fill="#0369a1">pull des images (imagePullSecret)</text>

  <!-- ns observabilite : surveillance -->
  <rect x="405" y="670" width="470" height="220" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-dasharray="5 3"/>
  <text class="ns" x="415" y="690">ns observabilite : surveillance (chart helm/observabilite)</text>
  <rect class="box" x="425" y="705" width="190" height="70"/>
  <text class="t" x="520" y="733">Prometheus</text>
  <text class="s" x="520" y="752">apiserver, kubelet, cAdvisor</text>
  <rect class="box" x="650" y="705" width="205" height="70"/>
  <text class="t" x="752" y="733">kube-state-metrics</text>
  <text class="s" x="752" y="752">état du cluster</text>
  <rect class="box" x="425" y="800" width="190" height="70"/>
  <text class="t" x="520" y="828">node-exporter</text>
  <text class="s" x="520" y="847">ressources du nœud</text>
  <rect class="box" x="650" y="800" width="205" height="70"/>
  <text class="t" x="752" y="828">metrics-server</text>
  <text class="s" x="752" y="847">kube-system · HPA, kubectl top</text>
  <path class="obs" d="M650,740 L617,740"/>
  <path class="obs" d="M520,800 L520,777"/>

  <!-- ns observabilite : logs -->
  <rect x="895" y="670" width="475" height="220" rx="10" fill="#fefce8" stroke="#a16207" stroke-dasharray="5 3"/>
  <text class="ns" x="905" y="690">ns observabilite : logs (EFK)</text>
  <rect class="box" x="915" y="715" width="135" height="80"/>
  <text class="t" x="982" y="742">Fluent Bit</text>
  <text class="s" x="982" y="760">DaemonSet</text>
  <text class="s" x="982" y="776">logs des conteneurs</text>
  <rect class="box" x="1075" y="715" width="135" height="80"/>
  <text class="t" x="1142" y="742">Elasticsearch</text>
  <text class="s" x="1142" y="760">index dotnetgigs-*</text>
  <text class="s" x="1142" y="776">PVC 5 Go</text>
  <rect class="box" x="1235" y="715" width="120" height="80"/>
  <text class="t" x="1295" y="742">Kibana</text>
  <text class="s" x="1295" y="760">dashboard</text>
  <text class="s" x="1295" y="776">recherche erreurs</text>
  <path class="obs" d="M1050,755 L1073,755"/>
  <path class="obs" d="M1233,755 L1212,755"/>
  <text class="s" x="1130" y="830">Fluent Bit lit les logs stdout des pods dotnetgigs</text>
  <text class="s" x="1130" y="846">(regroupement multiligne, champ level, labels Kubernetes)</text>

  <!-- Observabilité -->
  <path class="obs" d="M982,652 L982,711"/>
  <path class="obs" d="M560,652 L560,701"/>
  <text class="lt" x="570" y="668" fill="#64748b">métriques</text>
  <text class="lt" x="992" y="668" fill="#64748b">logs</text>
  <path class="obs" d="M180,760 L423,740"/>
  <path class="obs" d="M180,785 L392,785 L392,897 L1340,897 L1340,797"/>

  <!-- Légende -->
  <rect x="215" y="120" width="175" height="120" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="ns" x="225" y="140">Légende</text>
  <path class="ext" d="M228,160 L268,160"/><text class="lt" x="275" y="164">flux externe HTTPS</text>
  <path class="l" d="M228,185 L268,185"/><text class="lt" x="275" y="189">flux interne autorisé</text>
  <path class="obs" d="M228,210 L268,210"/><text class="lt" x="275" y="214">métriques / logs / admin</text>
  <text class="lt" x="228" y="232">ns = namespace</text>
</svg>
