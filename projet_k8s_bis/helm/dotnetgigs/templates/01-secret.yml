# Secret : range les mots de passe à part, au lieu de les écrire dans les Deployments.
# Les pods lisent ces valeurs comme variables d'environnement (voir "secretKeyRef").
# Le mot de passe vient de helm/secrets.enc.yaml (chiffré avec SOPS, voir README étape 4).
# "required" arrête l'installation avec un message clair si on a oublié ce fichier.
{{- $password := required "sqlPassword manquant : installer avec sops exec-file helm/secrets.enc.yaml (README, étape 4)" .Values.sqlPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: dotnetgigs-secrets
  labels:
    app: dotnetgigs
stringData:                       # valeurs en clair, Kubernetes les encode lui-même
  SA_PASSWORD: "{{ $password }}"
  # Chaînes de connexion des API : "Server=sql-data" = nom du Service SQL (03-sql-data.yml)
  JOBS_CONNECTION: "Server=sql-data;User=sa;Password={{ $password }};Database=dotnetgigs.jobs;"
  APPLICANTS_CONNECTION: "Server=sql-data;User=sa;Password={{ $password }};Database=dotnetgigs.applicants;"
