# user-data : Redis, utilisé par identity-api pour stocker les utilisateurs.
# ("user.data" dans le docker-compose : le point est interdit dans un nom Kubernetes)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-data
  labels:
    app: user-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-data
  template:
    metadata:
      labels:
        app: user-data
        tier: data
    spec:
      containers:
      - name: user-data
        image: redis:7-alpine     # image publique : pas besoin de dockerhub-secret
        ports:
        - containerPort: 6379
        # Ressources (CPU, RAM, disque temporaire) : lues dans values.yaml (resources.userData).
        # toYaml recopie le bloc tel quel, nindent 10 le décale de 10 espaces sous "resources:".
        resources:
          {{- toYaml .Values.resources.userData | nindent 10 }}
        readinessProbe:
          tcpSocket: { port: 6379 }
        livenessProbe:
          tcpSocket: { port: 6379 }
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-data
  labels:
    app: user-data
spec:
  selector:
    app: user-data
  ports:
  - port: 6379
