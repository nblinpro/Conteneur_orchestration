# rabbitmq : bus de messages entre les 3 API (port 5672).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        tier: messaging
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management   # image publique
        ports:
        - containerPort: 5672
        # Ressources (CPU, RAM, disque temporaire) : lues dans values.yaml (resources.rabbitmq).
        # toYaml recopie le bloc tel quel, nindent 10 le décale de 10 espaces sous "resources:".
        resources:
          {{- toYaml .Values.resources.rabbitmq | nindent 10 }}
        readinessProbe:
          tcpSocket: { port: 5672 }
          initialDelaySeconds: 15
        livenessProbe:
          tcpSocket: { port: 5672 }
          initialDelaySeconds: 60    # RabbitMQ démarre lentement
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
