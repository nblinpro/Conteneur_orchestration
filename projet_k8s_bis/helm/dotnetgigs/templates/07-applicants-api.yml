# applicants-api : API REST des candidats. Utilise sql-data et rabbitmq.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applicants-api
  labels:
    app: applicants-api
spec:
  replicas: {{ .Values.apiReplicas }}
  selector:
    matchLabels:
      app: applicants-api
  template:
    metadata:
      labels:
        app: applicants-api
        tier: backend
    spec:
      # Affinité (sujet) : applicants.api => sql.data
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: sql-data }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: applicants-api
        image: "{{ .Values.image }}:applicants-api"
        ports:
        - containerPort: 80
        env:
        - name: ConnectionString
          valueFrom:
            secretKeyRef: { name: dotnetgigs-secrets, key: APPLICANTS_CONNECTION }
        - name: HostRabbitmq
          value: rabbitmq
        - name: Logging__Console__LogLevel__Default
          value: Information
        # Ressources (CPU, RAM, disque temporaire) : lues dans values.yaml (resources.applicantsApi).
        # toYaml recopie le bloc tel quel, nindent 10 le décale de 10 espaces sous "resources:".
        resources:
          {{- toYaml .Values.resources.applicantsApi | nindent 10 }}
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: applicants-api
  labels:
    app: applicants-api
spec:
  selector:
    app: applicants-api
  ports:
  - port: 80
