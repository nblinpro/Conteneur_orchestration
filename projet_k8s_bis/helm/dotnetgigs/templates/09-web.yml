# web : le site. Appelle identity-api et jobs-api.
# Seule application visible de l'extérieur, et seulement via l'Ingress (12-ingress.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  # Pas de "replicas" : c'est l'HPA (10-hpa.yml) qui choisit le nombre de pods (2 à 3)
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      # Affinité (sujet) : web => jobs.api et applicants.api
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: jobs-api }
              topologyKey: kubernetes.io/hostname
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels: { app: applicants-api }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: web
        image: "{{ .Values.image }}:web"
        ports:
        - containerPort: 80
        env:
        # Adresses des API. Le code contient http://identity.api (avec un point),
        # interdit dans Kubernetes : on les remplace par les noms de nos Services.
        - name: ApiSettings__IdentityApiUrl
          value: http://identity-api
        - name: ApiSettings__JobsApiUrl
          value: http://jobs-api
        - name: Logging__LogLevel__Default
          value: Information
        # valeurs imposées par le sujet
        resources:
          requests: { cpu: 4m, memory: 900Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 2000Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
  - port: 80
