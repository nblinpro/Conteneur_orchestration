# Ingress : la porte d'entrée du site, en HTTPS.
#   navigateur --HTTPS--> contrôleur ingress-nginx --> Service web --> pods web
# Le contrôleur ingress-nginx n'est PAS dans le chart (demandé par le sujet) :
# il s'active avec "minikube addons enable ingress".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dotnetgigs-ingress
  labels:
    app: web
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"   # HTTP => redirigé vers HTTPS
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .Values.host }}
    secretName: dotnetgigs-tls      # certificat auto-signé, créé à la main (README étape 3)
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
