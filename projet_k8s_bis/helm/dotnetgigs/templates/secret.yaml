# Secret : range les mots de passe à part, au lieu de les écrire dans les Deployments.
# Les pods lisent ces valeurs comme variables d'environnement (voir "secretKeyRef").
apiVersion: v1
kind: Secret
metadata:
  name: dotnetgigs-secrets
  labels:
    app: dotnetgigs
stringData:                       # valeurs en clair, Kubernetes les encode lui-même
  SA_PASSWORD: "{{ .Values.sqlPassword }}"
  # Chaînes de connexion des API : "Server=sql-data" = nom du Service SQL (sql-data.yaml)
  JOBS_CONNECTION: "Server=sql-data;User=sa;Password={{ .Values.sqlPassword }};Database=dotnetgigs.jobs;"
  APPLICANTS_CONNECTION: "Server=sql-data;User=sa;Password={{ .Values.sqlPassword }};Database=dotnetgigs.applicants;"
