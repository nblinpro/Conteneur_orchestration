# Elasticsearch : la base où sont stockés les logs.
# EFK = Elasticsearch (stockage) + Fluent Bit (collecte) + Kibana (affichage).
# Réglages (image, disque, mémoire Java, ressources) : values.yaml, section elasticsearch.
# 3 objets : PersistentVolumeClaim (disque), Deployment, Service.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  labels:
    app: elasticsearch
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.elasticsearch.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate                  # un seul pod à la fois sur le disque
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        tier: logging
    spec:
      # Petit conteneur lancé avant Elasticsearch : donne le disque à l'utilisateur 1000,
      # celui d'Elasticsearch (sinon il ne peut pas écrire dedans)
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits:   { cpu: 100m, memory: 32Mi }
      containers:
      - name: elasticsearch
        image: {{ .Values.elasticsearch.image }}
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: single-node            # un seul serveur
        - name: xpack.security.enabled
          value: "false"                # pas de mot de passe (projet de cours)
        - name: ES_JAVA_OPTS
          value: {{ .Values.elasticsearch.javaOpts | quote }}
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        # Ressources lues dans values.yaml (elasticsearch.resources)
        resources:
          {{- toYaml .Values.elasticsearch.resources | nindent 10 }}
        # Prêt seulement quand l'API répond (le port s'ouvre avant la fin du démarrage)
        readinessProbe:
          httpGet: { path: /_cluster/health, port: 9200 }
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 9200 }
          initialDelaySeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: elasticsearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 9200
