# Elasticsearch : la base où sont stockés les logs.
# EFK = Elasticsearch (stockage) + Fluent Bit (collecte) + Kibana (affichage).
# Installation : kubectl apply -f logging/elasticsearch.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: logging
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        tier: logging
    spec:
      # Petit conteneur lancé avant Elasticsearch : donne le disque à l'utilisateur 1000,
      # celui d'Elasticsearch (sinon il ne peut pas écrire dedans)
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: single-node            # un seul serveur
        - name: xpack.security.enabled
          value: "false"                # pas de mot de passe (projet de cours)
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"    # mémoire Java : 512 Mo
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        resources:
          requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1536Mi, ephemeral-storage: 1Gi }
        readinessProbe:
          tcpSocket: { port: 9200 }
          initialDelaySeconds: 20
        livenessProbe:
          tcpSocket: { port: 9200 }
          initialDelaySeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: elasticsearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 9200
