# Kibana : le site web pour chercher dans les logs et faire des dashboards.
# Installation : kubectl apply -f logging/kibana.yaml
# Accès        : kubectl port-forward --address 0.0.0.0 -n logging svc/kibana 5601:5601
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        tier: logging
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.15.3
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: http://elasticsearch:9200    # le Service Elasticsearch
        resources:
          requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 100Mi }
          limits:   { cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi }
        # Prêt seulement quand l'API de Kibana répond : Kibana ouvre son port bien avant
        # d'avoir fini de démarrer (il répond alors "not ready yet"), un test TCP ne suffit pas
        readinessProbe:
          httpGet: { path: /api/status, port: 5601 }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 5601 }
          initialDelaySeconds: 120            # Kibana démarre lentement
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  selector:
    app: kibana
  ports:
  - port: 5601
