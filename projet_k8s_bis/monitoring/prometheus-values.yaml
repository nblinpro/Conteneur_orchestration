# Réglages du chart Prometheus officiel (prometheus-community/prometheus).
# Il installe :
#   - Prometheus         : collecte et stocke les métriques (plan de contrôle via l'apiserver,
#                          kubelet, et CPU/mémoire de chaque pod via cAdvisor)
#   - kube-state-metrics : état du cluster (pods, deployments, HPA...)
#   - node-exporter      : ressources du nœud (CPU, RAM, disque)
# Installation : voir README, étape 5.

server:
  retention: "2d"          # garde 2 jours de métriques
  persistentVolume:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

# Limites de ressources des 2 composants de collecte (chaque pod doit en avoir)
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits:   { cpu: 100m, memory: 64Mi }

# Inutiles pour le projet : désactivés pour économiser de la mémoire
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
